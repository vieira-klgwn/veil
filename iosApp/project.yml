name: Veil
options:
  bundleIdPrefix: app.veil
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

targets:
  Veil:
    type: application
    platform: iOS
    sources:
      - path: Veil
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Veil
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSCameraUsageDescription: Veil needs the camera to take photos and videos with faces protected on this device.
        NSMicrophoneUsageDescription: Veil records audio with your videos.
        NSPhotoLibraryAddUsageDescription: Veil saves protected photos and videos to your library. Originals are never saved.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.veil.camera
        SWIFT_VERSION: "5.9"
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        # The Kotlin Multiplatform engine, built by the Gradle phase below.
        FRAMEWORK_SEARCH_PATHS: $(inherited) $(SRCROOT)/../core-privacy/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)
        OTHER_LDFLAGS: $(inherited) -framework VeilPrivacy
    preBuildScripts:
      - name: Build VeilPrivacy (Kotlin Multiplatform)
        basedOnDependencyAnalysis: false
        script: |
          cd "$SRCROOT/.."
          ./gradlew :core-privacy:embedAndSignAppleFrameworkForXcode
